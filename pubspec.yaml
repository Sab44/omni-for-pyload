name: omni_for_pyload
description: "Your all-in-one mobile app for pyLoad."
publish_to: 'none'
version: 0.2.1

environment:
  sdk: ^3.9.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  http: ^1.6.0
  openapi_client:
    path: ./packages/openapi_client
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mockito: ^5.8.1

flutter:
  uses-material-design: true
